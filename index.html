<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沖繩五日 自駕手冊｜2026.08.14–18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16324A;        /* 墨藍 */
  --paper:#FBFAF6;      /* 紙白 */
  --sea:#128A7E;        /* 金武灣綠 */
  --sea-deep:#0B5F58;
  --coral:#DE5B45;      /* 珊瑚 */
  --sand:#EDE6D6;       /* 砂 */
  --shallow:#E3F1ED;    /* 淺海 */
  --mute:#6B7C8A;
  --c-spot:#128A7E; --c-shop:#4A6FA5; --c-dining:#DE5B45; --c-basic:#7A8794;
  --serif:'Noto Serif TC',"PMingLiU",serif;
  --sans:'Noto Sans TC',"Microsoft JhengHei",sans-serif;
  --mono:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:16px}
a{color:var(--sea-deep)}

/* ── 封面 ── */
.cover{position:relative;min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:8vh 24px 12vh;max-width:960px;margin:0 auto;overflow:hidden}
.cover .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.35em;color:var(--sea-deep);text-transform:uppercase}
.cover h1{font-family:var(--serif);font-weight:900;font-size:clamp(56px,12vw,120px);line-height:1.05;letter-spacing:.06em;margin:12px 0 4px}
.cover h1 .en{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(13px,2vw,17px);letter-spacing:.55em;color:var(--mute);margin-top:10px}
.cover .dates{font-family:var(--serif);font-size:clamp(20px,3.4vw,30px);font-weight:700;color:var(--sea-deep);margin:18px 0 30px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--ink);border:1px solid var(--ink);max-width:760px}
.facts div{background:var(--paper);padding:14px 16px}
.facts b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute);margin-bottom:4px}
.facts span{font-weight:700;font-size:15px}
.wavefoot{position:absolute;left:0;right:0;bottom:0;height:90px;opacity:.9;pointer-events:none}

/* ── 波紋分隔 ── */
.waveband{display:block;width:100%;height:44px;color:var(--sea)}

/* ── 共用容器 ── */
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
section.day{padding:56px 0 40px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px 22px;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:8px}
.dayno{font-family:var(--serif);font-weight:900;font-size:52px;line-height:1;color:var(--sea)}
.daydate{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.12em}
.daytheme{font-family:var(--serif);font-weight:700;font-size:24px}
.daydrive{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mute);background:var(--shallow);padding:5px 12px;border-radius:999px;white-space:nowrap}
.daynote{background:var(--sand);border-left:4px solid var(--sea);padding:12px 16px;margin:18px 0 8px;font-size:14.5px;border-radius:0 8px 8px 0}
.daynote b{color:var(--sea-deep)}
.daynote.alert{border-left-color:var(--coral)}
.daynote.alert b{color:var(--coral)}

/* ── 行程脊柱 ── */
.spine{position:relative;margin:26px 0 0;padding-left:34px}
.spine::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:3px;background:linear-gradient(var(--sea) 60%,rgba(18,138,126,.25));border-radius:2px}
.slotlabel{position:relative;font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.3em;color:var(--sea-deep);margin:26px 0 10px}
.slotlabel::before{content:"";position:absolute;left:-30px;top:5px;width:11px;height:11px;background:var(--paper);border:3px solid var(--sea);border-radius:50%}
.spine>.slotlabel:first-child{margin-top:0}

/* ── 車程籤 ── */
.drive{position:relative;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--sea-deep);background:var(--shallow);border:1px dashed var(--sea);border-radius:999px;padding:5px 14px;margin:12px 0}
.drive::before{content:"🚗"}
.drive small{color:var(--mute);font-weight:500;letter-spacing:0}
.walk{background:var(--sand);border-color:#C9BFA6;color:#6E6146}
.walk::before{content:"🚶"}

/* ── 景點卡 ── */
.card{background:#fff;border:1px solid #DCD8CC;border-radius:14px;overflow:hidden;margin:10px 0;box-shadow:0 2px 10px rgba(22,50,74,.05)}
.card.hero .photo{aspect-ratio:16/8.5}
.photo{position:relative;aspect-ratio:16/7;overflow:hidden;display:block;
  background:linear-gradient(160deg,#E3F1ED 0%,#D2E9E2 55%,#C4E0D8 100%)}
.photo .ph-deco{position:absolute;inset:0;color:#128A7E;opacity:.5}
.photo .ph-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 20px}
.photo .ph-hint b{font-family:var(--serif);font-size:22px;color:var(--sea-deep);letter-spacing:.1em}
.photo .ph-hint span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.photo img{position:relative;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.photo.on img{opacity:1}
.photo .swap,.photo .credit{display:none;z-index:3}
.photo.on .swap,.photo.on .credit{display:block}
.photo .cust{position:absolute;right:8px;top:8px;z-index:3;font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.92);border:1px solid #C9C3B4;color:var(--ink);padding:3px 10px;border-radius:999px;cursor:pointer}
.photo .hidebtn{position:absolute;left:8px;top:8px;z-index:3;font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.92);border:1px solid #C9C3B4;color:var(--ink);padding:3px 10px;border-radius:999px;cursor:pointer}
.card.hidph .photo{display:none}
.showph{display:none;font-size:11.5px;font-family:var(--mono);background:none;border:1px dashed #B9B2A0;color:var(--mute);padding:2px 10px;border-radius:999px;cursor:pointer;margin-left:auto}
.card.hidph .showph{display:inline-block}
.exportbtn{position:fixed;right:18px;bottom:66px;z-index:9;background:var(--sea-deep);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(11,95,88,.3)}
.photo .credit{position:absolute;right:8px;bottom:6px;font-size:10px;font-family:var(--mono);background:rgba(22,50,74,.55);color:#fff;padding:2px 8px;border-radius:999px;text-decoration:none}
.photo .swap{position:absolute;left:8px;bottom:6px;font-size:11px;font-family:var(--mono);background:rgba(255,255,255,.85);color:var(--ink);border:none;padding:3px 10px;border-radius:999px;cursor:pointer}
.cbody{padding:16px 18px 15px}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cname{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.02em}
.chip{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff;letter-spacing:.08em}
.area{font-family:var(--mono);font-size:12px;color:var(--mute)}
.intro{font-size:15px;margin-top:8px;color:#2A4459;text-align:justify}
.memo{margin-top:10px;font-size:13.5px;background:#FFF8E3;border:1px solid #EAD9A0;border-radius:8px;padding:7px 12px;color:#6E5A1E}
.memo::before{content:"✎ 筆記　";font-weight:700}
.cfoot{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.mapbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;color:var(--sea-deep);border:1.5px solid var(--sea);border-radius:999px;padding:4px 14px;transition:.15s}
.mapbtn:hover{background:var(--sea);color:#fff}
.tiny{font-family:var(--mono);font-size:12px;color:var(--mute);align-self:center}

/* 小卡（購物/餐飲等次要點） */
.card.mini .cbody{padding:12px 16px}
.card.mini .cname{font-size:17px}
.card.mini .intro{font-size:14px}

/* ── 口袋名單 / 資訊 ── */
.pocket{padding:48px 0 24px}
h2.sec{font-family:var(--serif);font-weight:900;font-size:30px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:20px}
h2.sec small{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.3em;color:var(--mute);margin-left:12px}
.infogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:8px}
.info{background:#fff;border:1px solid #DCD8CC;border-radius:12px;padding:16px 18px}
.info h3{font-family:var(--serif);font-size:17px;margin-bottom:6px;color:var(--sea-deep)}
.info p{font-size:14px;color:#2A4459}
.info .mono{font-family:var(--mono);font-size:13px}

/* ── 頁尾 ── */
footer{padding:40px 24px 60px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--mute)}
.printbtn{position:fixed;right:18px;bottom:18px;z-index:9;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:10px 18px;font-family:var(--sans);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(22,50,74,.3)}

@media (max-width:560px){
  .cname{font-size:18px}
  .dayno{font-size:42px}
  .daydrive{margin-left:0}
}
@media print{
  .printbtn,.exportbtn,.swap,.cust,.hidebtn,.showph{display:none!important}
  body{font-size:12.5px}
  section.day{page-break-before:always;padding:20px 0}
  .cover{min-height:auto;page-break-after:always}
  .card{box-shadow:none;break-inside:avoid}
  a{text-decoration:none;color:var(--ink)}
  .mapbtn{border-color:#bbb;color:#555}
}
@media (prefers-reduced-motion:no-preference){
  .card{animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>

 arrive:{n:'華航 CI120｜10:45 抵達那霸機場',c:'basic',intro:'入境審查與提領行李旺季約需 60–90 分鐘，之後到國內線側搭 OTS 接駁車。抵達後先別急，行程上午只排這一件事。'},
 ots:{n:'OTS 臨空豐崎營業所',c:'basic',area:'豐崎',photo:[26.1588,127.6544],q:'OTS レンタカー 豊崎',

 ashibinaa:{n:'ASHIBINAA Outlet',c:'shop',area:'豐崎',photo:[26.1591,127.6576],q:'沖縄アウトレットモールあしびなー',hero:1,

 dmm:{n:'DMM Kariyushi 水族館',c:'spot',area:'豐崎',photo:[26.1564,127.6507],q:'DMMかりゆし水族館',hero:1,

 beb5:{n:'星野集團 BEB5 沖繩瀨良垣',c:'basic',area:'恩納',photo:[26.5031,127.8624],q:'BEB5沖縄瀬良垣',hero:1,

 minatogawa:{n:'港川外人住宅（STATESIDE TOWN）',c:'spot',area:'浦添',photo:[26.2625,127.7146],q:'港川ステイツサイドタウン',hero:1,

    </div></article>`;
}

/* ───────── Wikimedia Commons 照片載入（JSONP，file:// 開啟也能用） ───────── */
const cache={};
function jsonp(url,timeout=8000){return new Promise((res,rej)=>{
  const cb='__wm'+Math.random().toString(36).slice(2);
  const sc=document.createElement('script');
  const clean=()=>{delete window[cb];sc.remove();clearTimeout(t)};
  const t=setTimeout(()=>{clean();rej(new Error('timeout'))},timeout);
  window[cb]=d=>{clean();res(d)};
  sc.onerror=()=>{clean();rej(new Error('network'))};
  sc.src=url+'&callback='+cb;
  document.head.appendChild(sc);
})}
async function apiGet(url){
  try{
    const r=await fetch(url+'&origin=*');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){
    console.warn('[手冊] fetch 失敗，改用 JSONP：',e.message);
    return await jsonp(url);
  }
}
function setHint(box,msg){const h=box.querySelector('.ph-hint span');if(h)h.textContent=msg}
function show(box,src,creditUrl){
  const img=box.querySelector('img');
  img.onload=()=>box.classList.add('on');
  img.onerror=()=>{box.classList.remove('on');setHint(box,'圖檔載入失敗 — 按「✎ 自訂」換一張或點下方地圖')};
  img.src=src;
  const c=box.querySelector('.credit');
  if(creditUrl){c.href=creditUrl;c.style.display=''}else{c.style.display='none'}
}
/* 自訂照片＋隱藏狀態：localStorage（GitHub Pages 上有效）＋匯出時內嵌 */
let OVR={},HID={};
try{
  const b=JSON.parse(document.getElementById('baked').textContent||'{}');
  if(b.ovr||b.hid){OVR=b.ovr||{};HID=b.hid||{}}else{OVR=b}
}catch(e){}
try{Object.assign(OVR,JSON.parse(localStorage.getItem('okiPhotos')||'{}'))}catch(e){}
try{Object.assign(HID,JSON.parse(localStorage.getItem('okiHidden')||'{}'))}catch(e){}
function saveOVR(){try{localStorage.setItem('okiPhotos',JSON.stringify(OVR))}catch(e){alert('此環境無法儲存，請用「匯出含照片版」保存')}}
function saveHID(){try{localStorage.setItem('okiHidden',JSON.stringify(HID))}catch(e){}}
function hidePhoto(id,flag){
  const card=document.querySelector('.card[data-id="'+id+'"]'); if(!card) return;
  if(flag){HID[id]=1;card.classList.add('hidph')}
  else{delete HID[id];card.classList.remove('hidph');applyPhoto(id,parseInt((document.getElementById('ph-'+id)||{dataset:{}}).dataset.idx||0))}
  saveHID();
}
let pickTarget=null;
document.getElementById('filepick').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f||!pickTarget) return;
  const r=new FileReader();
  r.onload=()=>{OVR[pickTarget]=r.result;saveOVR();applyPhoto(pickTarget)};
  r.readAsDataURL(f); ev.target.value='';
});
function customPhoto(id){
  const c=prompt('自訂「'+SPOTS[id].n+'」的照片：\n1＝貼上圖片網址　2＝上傳圖片檔　3＝清除自訂','1');
  if(c==='1'){const u=prompt('貼上圖片網址（img 的 https:// 連結）：');if(u&&/^https:\/\//.test(u.trim())){OVR[id]=u.trim();saveOVR();applyPhoto(id)}}
  else if(c==='2'){pickTarget=id;document.getElementById('filepick').click()}
  else if(c==='3'){delete OVR[id];saveOVR();applyPhoto(id)}
}
function applyPhoto(id,idx=0){
  const s=SPOTS[id],box=document.getElementById('ph-'+id); if(!box) return;
  if(OVR[id]){show(box,OVR[id],null);return}
  if(s.fixed&&s.fixed.length){show(box,s.fixed[idx%s.fixed.length]+'?width=1100',s.fixed[idx%s.fixed.length].replace('Special:FilePath/','File:'));box.dataset.idx=idx;return}
  loadPhoto(id,idx);
}
function exportHTML(){
  const clone=document.documentElement.cloneNode(true);
  const b=clone.querySelector('#baked'); if(b) b.textContent=JSON.stringify({ovr:OVR,hid:HID});
  const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='沖繩五日自駕手冊.html';a.click();
}
async function loadPhoto(id,idx=0){
  const s=SPOTS[id]; if(!s.photo) return;
  const box=document.getElementById('ph-'+id); if(!box) return;
  try{
    if(!cache[id]){
      setHint(box,'照片載入中…');
      const [lat,lng]=s.photo;
      let imgs=[];
      const geo=`https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${lat}%7C${lng}&ggsradius=1200&ggslimit=12&ggsnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=1000&format=json`;
      try{const j=await apiGet(geo); if(j.query) imgs=Object.values(j.query.pages)}catch(e){console.warn('[手冊] geosearch 失敗',id,e)}
      if(imgs.length<2 && s.q){
        const q=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(s.q)}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=1000&format=json`;
        try{const j2=await apiGet(q); if(j2.query) imgs=imgs.concat(Object.values(j2.query.pages))}catch(e){console.warn('[手冊] 關鍵字搜尋失敗',id,e)}
      }
      console.log('[手冊]',id,'找到',imgs.length,'筆候選');
      cache[id]=imgs.map(p=>p.imageinfo&&p.imageinfo[0]).filter(i=>i&&/\.(jpe?g|png|webp)$/i.test(i.url));
      if(!cache[id].length){setHint(box,imgs.length===0?'連不上 Wikimedia（看 F12 Console 訊息）— 點下方地圖看實景':'Commons 沒有這個點的照片 — 點下方地圖看實景');return}
    }
    const list=cache[id]; if(!list.length) return;
    const pick=list[idx%list.length];
    show(box,pick.thumburl||pick.url,pick.descriptionurl||'#');
    box.dataset.idx=idx;
  }catch(e){setHint(box,'照片載入失敗（'+e.message+'）— 點下方地圖看實景')}
}
function swapPhoto(id){
  const box=document.getElementById('ph-'+id);
  applyPhoto(id,(parseInt(box.dataset.idx||0)+1));
}
/* 進入視窗才載入 */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){const id=e.target.dataset.id;if(SPOTS[id]&&SPOTS[id].photo&&!HID[id]){applyPhoto(id);io.unobserve(e.target)}}
}),{rootMargin:'400px'});
document.querySelectorAll('.card').forEach(c=>{
  const id=c.dataset.id;
  if(HID[id]) c.classList.add('hidph');
  io.observe(c);
});
</script>
